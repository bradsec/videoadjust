name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      # build also runs check:licenses and typecheck (tsc --noEmit) before vite build.
      - run: pnpm build
      - run: pnpm check:size

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The image ships chromium, webkit and their system packages, so shards skip the browser
    # install. Its tag must match @playwright/test, which package.json pins exactly for that reason.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e --workers=2 --shard=${{ matrix.shard }}
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ strategy.job-index }}
          path: blob-report/
          if-no-files-found: ignore
          retention-days: 1
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ strategy.job-index }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # The merged HTML report is for debugging, so green runs skip this job.
  e2e-report:
    if: ${{ !cancelled() && needs.e2e.result == 'failure' }}
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - run: pnpm exec playwright merge-reports --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
