<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>videoadjust share image</title>
    <!-- Laid out like rastertrace's share image so the sibling apps read as a family. Colours
         and fonts come from the app's own tokens. -->
    <link rel="stylesheet" href="../src/styles/tokens.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-ui);
        overflow: hidden;
      }
      main {
        display: flex;
        align-items: center;
        gap: 56px;
        width: 1200px;
        height: 630px;
        padding: 0 100px 80px;
      }
      .logo {
        flex: none;
        width: 220px;
        height: 220px;
      }
      h1 {
        margin: 0 0 18px;
        font-size: 92px;
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1;
      }
      p {
        margin: 0;
        font-size: 34px;
        line-height: 1.3;
      }
      .what {
        color: var(--text-2);
      }
      .how {
        margin-top: 26px;
        font-size: 26px;
        color: var(--accent);
      }
    </style>
  </head>
