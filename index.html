<!doctype html>
<html lang="en">
  <head>

    <title>videoresize</title>

  <body>
    <svg class="sprite" width="0" height="0" aria-hidden="true" focusable="false">
      <defs>
        <symbol id="i-logo" viewBox="0 0 26 26">
          <rect x="1.5" y="3.5" width="23" height="17" rx="4" fill="none" stroke="currentColor" stroke-width="1.8" />
          <rect class="logo-signal" x="11" y="10" width="10" height="7" rx="2" />
          <path d="M5.5 12 L10 12 L10 7.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />

        </symbol>
        <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2.5" /><path d="M8 11V8a4 4 0 0 1 8 0v3" /></symbol>

      </defs>
    </svg>
    <header class="bar">

      <span class="chip"><svg class="i" aria-hidden="true"><use href="#i-lock" /></svg>Stays on this device</span>

    <footer>
      <span>Free. Works offline after your first visit.</span>
